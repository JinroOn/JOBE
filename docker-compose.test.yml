services:
  test-mysql:
    image: mysql:8.0.46
    environment:
      MYSQL_ROOT_PASSWORD: jobe-test-only
      MYSQL_DATABASE: jobe_test
    ports:
      - "127.0.0.1:13307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
