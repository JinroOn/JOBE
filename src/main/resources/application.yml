spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/jobe}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
  security:
    user:
      password: ${SPRING_SECURITY_USER_PASSWORD:temp1234}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

jwt:
  secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}

ai:
  server:
    url: ${AI_SERVER_URL:http://localhost:8001}
    token: ${AI_SERVER_TOKEN:${INTERNAL_SERVICE_TOKEN:}}
    connect-timeout-ms: ${AI_SERVER_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AI_SERVER_READ_TIMEOUT_MS:10000}

major:
  dataset:
    majors-path: ${MAJOR_DATASET_MAJORS_PATH:datasets/majors}
    rag-path: ${MAJOR_DATASET_RAG_PATH:datasets/rag/per-major}

diagnosis:
  questions:
    seed:
      enabled: ${DIAGNOSIS_QUESTIONS_SEED_ENABLED:true}
      path: ${DIAGNOSIS_QUESTIONS_SEED_PATH:classpath:data/evaluation-questions-separated-60.json}
      default-time-limit-sec: ${DIAGNOSIS_QUESTIONS_DEFAULT_TIME_LIMIT_SEC:60}

app:
  mail:
    from-name: ${MAIL_FROM_NAME:JOBE}
