name: Backend Tests

# PR과 develop 푸시마다 백엔드 테스트를 실행한다.
# deploy.yml도 이 워크플로를 호출해, 테스트가 통과해야 이미지 빌드·배포로 넘어간다.
on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop ]
  workflow_call:

permissions:
  contents: read

jobs:
  ai-test:
    name: AI Tests and PostgreSQL Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: section32_ai_test
          POSTGRES_USER: section32
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U section32 -d section32_ai_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AI_DATABASE_URL: postgresql+psycopg://section32:ci-test-only@localhost:5432/section32_ai_test
      SECTION32_TEST_DATABASE_URL: postgresql+psycopg://section32:ci-test-only@localhost:5432/section32_ai_test
      MOCK_MODE: 'true'
      AI_RAG_AUTO_INGEST_ENABLED: 'false'
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Verify exploration input manifests
        working-directory: .
        run: python scripts/verify_exploration_preparation.py
      - run: python -m alembic upgrade head
      - run: python -m pytest tests -q

  test:
    name: Gradle Test
    runs-on: ubuntu-latest

    # 개발 jobe와 분리된 전용 schema. Spring 통합 테스트 공통 guard가 JOBE_TEST_DATABASE_*만 사용한다.
    env:
      JOBE_TEST_DATABASE_URL: jdbc:mysql://127.0.0.1:3307/jobe_test?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul
      JOBE_TEST_DATABASE_USERNAME: root
      JOBE_TEST_DATABASE_PASSWORD: ci-test-only
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_DATABASE: jobe_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
