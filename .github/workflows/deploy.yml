name: Deploy to Demo Server

# main에 반영되면 테스트를 통과한 뒤 데모 서버에 배포한다. 준비 방법은 scripts/deploy/README.md에 있다.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      allow_migration:
        description: DB 변경 확인을 마쳤고 배포를 허용함
        type: boolean
        default: false

permissions:
  contents: read

# 배포는 한 번에 하나만 실행하고, 진행 중인 배포를 취소하지 않는다.
concurrency:
  group: deploy-demo-server
  cancel-in-progress: false

jobs:
  # ci.yml 재사용. 실패하면 배포하지 않는다.
  test:
    name: Test
    if: github.repository == 'JinroOn/JOBE' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build and Deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 테스트는 앞의 test job에서 통과했으므로 여기서는 JAR만 만든다.
      - name: Build JAR
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test --no-daemon
          if unzip -l build/libs/jobe-0.0.1-SNAPSHOT.jar | grep -E 'application-(prod|dev)\.yml'; then
            echo '::error::환경 설정 파일이 JAR에 포함되었습니다.'; exit 1
          fi

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ALLOW_MIGRATION: ${{ inputs.allow_migration && ' allow-migration' || '' }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!name}" ] || { echo "::error::$name 시크릿이 없습니다."; exit 1; }
          done
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          jar=build/libs/jobe-0.0.1-SNAPSHOT.jar
          jar_sha="$(sha256sum "$jar" | cut -d' ' -f1)"
          ssh -i "$RUNNER_TEMP/ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "ubuntu@$DEPLOY_HOST" "deploy $GITHUB_SHA $jar_sha$ALLOW_MIGRATION" < "$jar"

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
