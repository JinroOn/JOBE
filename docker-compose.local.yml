# Optional local-only host access. Default compose keeps DB and AI services internal.
services:
  mysql:
    ports:
      - "127.0.0.1:3307:3306"
  ai-postgres:
    ports:
      - "127.0.0.1:5433:5432"
  ai-service:
    ports:
      - "127.0.0.1:8001:8001"
  # 로컬 회원가입·비밀번호 재설정 메일 확인용. 백엔드를 mailpit 프로필로 실행하면 이곳으로 발송되고,
  # http://localhost:8025 에서 받은 메일(인증번호)을 볼 수 있다. 실제로 외부에 발송하지 않는다.
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: jobe-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
